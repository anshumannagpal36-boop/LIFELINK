<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifelink</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <link rel="stylesheet" href="style/admin.css">

    <script>
        let myModule = angular.module("mouduleKuch", []);
        let myController = myModule.controller("controllerKuch", function ($scope, $http) {


            $scope.doShowAll = function () {
                let url = "/fetch-all";
                $http.get(url).then(function (resp) {
                    //alert(JSON.stringify(resp.data))
                    $scope.jsonArray = resp.data;
                }, function (err) {
                    alert(err);
                });
            }
            //----------------------
            $scope.doDelete = function (emailidKuch) {
                //let url="/do-delete?emailKeyKuch="+emailidKuch+"&pwdKuch="+pwdValue;
                alert(emailidKuch);
                let url = "/do-delete?emailKeyKuch=" + emailidKuch;
                $http.get(url).then(function (resp) {
                    alert(JSON.stringify(resp.data))
                    $scope.doShowAll();

                }, function (err) {
                    alert(err);
                });
            }
            $scope.doBlock = function (email_) {
                alert("You want to block");
                let url = "/doBlock?email_0=" + email_;
                $http.get(url).then(function (resp) {
                    alert(JSON.stringify(resp.data))
                    $scope.doShowAll();
                })
            }

             $scope.doUnblock = function (email) {
                alert("You want to Unblock");
                let url = "/doUnBlock?email_1=" + email;
                $http.get(url).then(function (resp) {
                    alert(JSON.stringify(resp.data))
                    $scope.doShowAll();
                })
            }

        })
    </script>
</head>

<body ng-app="mouduleKuch" ng-controller="controllerKuch" ng-init="doShowAll();">
    <center>
        <input type="button" ng-click="doShowAll();" value="Fetch all records" style="margin-bottom: 10px; width: 150px; height: 40px;">

        <table width="800" border="1">
            <tr>
                <th>Sr.No.</th>
                <th>Email id</th>
                <th>Password</th>
                <th>user type</th>
                <th>Date of signup</th>
                <th>Status</th>
                <th>Operations</th>
            </tr>
            <tr ng-repeat="obj in jsonArray">
                <td>{{$index+1}}</td>
                <td>{{obj.email}}</td>
                <td>{{obj.password_}}</td>
                <td>
                <td>
                    <input type="button" value="Unblock" id="btn" class="btn btn-success" ng-show="obj.status_==0"
                        ng-click="doUnblock(obj.email)" />

                    <input type="button" value="Block" id="btn1" class="btn btn-danger" ng-show="obj.status_==1"
                        ng-click="doBlock(obj.email)" />
                </td>
                </td>
                <td>{{obj.date_of_signup | date:'dd-MMM-yyyy'}}</td>
                <td align="center">
                    <a href="#" ng-click="doDelete(obj.email);">Delete</a>
                </td>

            </tr>

        </table>
    </center>
</body>

</html>
