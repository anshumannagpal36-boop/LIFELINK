<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="stylesheet" href="style/needy.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        function doShowPrev(fileCtrl, prev) {

            const file = fileCtrl.files[0];

            if (file) {
                prev.src = URL.createObjectURL(file);
            }

        }
    </script>
    <script>
        function setemail() {
            document.getElementById("email").value = localStorage.getItem("activeuser");

        }
    </script>


</head>

<body onload="setemail()">
    <form action="/needy-profile" enctype="multipart/form-data" method="post">
        <input type="hidden" id="hnd" name="hnd">
        <input type="hidden" id="hnd1" name="hnd1">
        <!-- Heading -->

        <div class="container-fluid mt-4">

            <h1 class="main-heading">Needy Profile</h1>

            <div class="title-divider">
                <span class="line"></span>
                <i class="fa-solid fa-heart-pulse"></i>
                <span class="line"></span>
            </div>

        </div>


        <!-- Main Card -->

        <div class="container donor-card">
            <!-- Profile Card -->

            <div class="profile-box">

                <div class="text-center mb-5">

                    <i class="fa-regular fa-user profile-icon"></i>

                    <span class="profile-title">
                        Needy Profile
                    </span>

                </div>


                <!-- Email -->

                <div class="row mb-4">

                    <div class="col-md-5">

                        <label>Email Id</label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="fa-regular fa-envelope"></i>
                            </span>

                            <input type="email" class="form-control custom-input" placeholder="Enter email" id="email"
                                name="email">

                        </div>

                    </div>

                    <!-- Mobile -->

                    <div class="col-md-4">

                        <label>Mobile Number</label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="fa-solid fa-phone"></i>
                            </span>

                            <input type="text" class="form-control custom-input" placeholder="Enter mobile number"
                                id="no" name="no">

                        </div>

                    </div>

                </div>


            </div>




            <!-- Upload Section -->

            <div class="row mb-5">

                <!-- Aadhaar Card -->
                <div class="col-md-6">

                    <label>Upload Aadhaar Card Front</label>

                    <div class="upload-box text-center">

                        <img src="" id="prevAadhar" width="500" height="500"
                            style="width: 200px; height: 200px; border:1px solid #ccc; margin-bottom:10px; object-fit:cover;">

                        <input type="file" class="form-control mt-3" name="Aadhar_pic" id="Aadhar_pic"
                            onchange="doShowPrev(this, prevAadhar)">

                    </div>

                </div>

                <!-- Profile Picture -->
                <div class="col-md-6">

                    <label>Upload Aadhaar Card Back</label>

                    <div class="upload-box text-center">

                        <img src="" id="prevProfile" width="100" height="100"
                            style="width: 200px; height: 200px; border:1px solid #ccc; margin-bottom:10px; object-fit:cover;">

                        <input type="file" id="profile_pic" name="Aadhar_pic1" class="form-control mt-3"
                            onchange="doShowPrev(this, prevProfile)">


                    </div>

                </div>

            </div>
        </div>


        <!-- Buttons -->

        <div class="text-center">

            <input type="submit" id="btn1" value="Submit">
        </div>

        </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </form>
</body>

</html>
