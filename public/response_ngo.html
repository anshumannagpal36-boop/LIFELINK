<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation Page</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- FontAwesome for Icons -->
    <link href="https://cloudflare.com" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .confirmation-box {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>

    <script>

        $(document).ready(function(){
            $("#user").html(user)
        })

    </script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5 text-center p-4 confirmation-box">
                <!-- Success Icon -->
                <div class="mb-4">
                    <i class="fa-solid fa-circle-check text-success display-1"></i>
                </div>
                
                <!-- Main Message -->
                <h2 class="fw-bold mb-3">Request Successful!<br></h2><h3><div id="user"></div></h3>
                <p class="text-muted mb-4">Your Request Have Been Procceded, You Can Continue Ahead</p>

                <!-- Summary/Details Card -->
                <div class="card bg-light mb-4 text-start border-0">
                    <div class="card-body">
                        <h5 class="card-title fw-semibold mb-3">Summary</h5>
                        <ul class="list-unstyled mb-0">
                            <li class="d-flex justify-content-between mb-2">
                                <span>Date:</span>
                                <span class="text-muted">June 26, 2026</span>
                            </li>
                            <li class="d-flex justify-content-between">
                                <span>Status:</span>
                                <span class="badge bg-success">Completed</span>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-grid gap-2 d-md-block">
                    <a href="/NGOdash" class="btn btn-primary px-4 me-md-2">Return To Home</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
