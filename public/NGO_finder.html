<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Find NGO</title>

    <link rel="stylesheet" href="style/medfind.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script>

        let myModule =
            angular.module("mouduleKuch", []);


        let myController =
            myModule.controller("controllerKuch",
                function ($scope, $http) {


                    // FETCH DISTINCT CITIES

                    $scope.doShowAllcity =
                        function () {


                            let url =
                                "/fetch-distinct-city-ngo";


                            $http.get(url)
                                .then(function (resp) {


                                    $scope.jsonArraycity =
                                        resp.data;


                                }, function (err) {


                                    alert("Error fetching cities");

                                    console.log(err);


                                });

                        };

                    $scope.doFetchNGO = function () {

                        if (!$scope.selCity) {

                            alert("Please select a city");

                            return;

                        }


                        let url =
                            "/fetch-ngo?city="
                            + $scope.selCity;


                        $http.get(url).then(

                            function (resp) {

                                $scope.jsonArrayNGO = resp.data;

                            },

                            function (err) {

                                alert("Error while fetching NGO data");

                                console.log(err);

                            }

                        );

                    };

                    // SHOW NGO DETAILS

                    $scope.doShowDetails =
                        function (obj) {


                            $scope.NGOObj =
                                obj;


                        };


                });


    </script>

</head>


<body ng-app="mouduleKuch" ng-controller="controllerKuch" ng-init="doShowAllcity()">


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>




    <!-- PAGE HEADER -->

    <div class="container text-center text-white mt-5">

        <h1>

            <i class="fa-solid fa-magnifying-glass"></i>

            Find NGO Near You

        </h1>


        <p class="lead">

            Discover NGOs working for different causes in your city.

        </p>

    </div>


    <!-- SEARCH AREA -->

    <div class="container mt-5">

        <div class="row align-items-end text-white">

            <div class="col-md-5">

                <label class="form-label">

                    <i class="fa-solid fa-location-dot"></i>

                    City Name

                </label>


                <input list="city-list" ng-model="selCity" placeholder="Enter city name" class="form-control">


                <datalist id="city-list">

                    <option ng-repeat="obj in jsonArraycity" value="{{obj.City}}">

                    </option>

                </datalist>

            </div>


            <div class="col-md-2">

                <button class="btn btn-primary w-100" ng-click="doFetchNGO()">

                    <i class="fa-solid fa-search"></i>

                    Search

                </button>

            </div>

        </div>

    </div>

    <div class="container mt-5">

        <div class="table-responsive">

            <table class="table table-dark table-hover table-bordered align-middle">

                <thead>

                    <tr>

                        <th>Sr.NO</th>
                        <th>NGO Name</th>
                        <th>Office</th>
                        <th>City</th>
                        <th>WEBSITE</th>
                        <th>Contact Number</th>

                    </tr>

                </thead>


                <tbody>

                    <tr ng-repeat="obj in jsonArrayNGO">

                        <td>

                            {{$index + 1}}

                        </td>


                        <td>

                            <strong>

                                {{obj.NGO}}

                            </strong>

                        </td>


                        <td>

                            {{obj.Office}}

                        </td>


                        <td>

                            {{obj.City}}

                        </td>
                        <td>

                            {{obj.web}}

                        </td>
                        <td>

                            {{obj.no}}

                        </td>

                    </tr>


                    <tr ng-if="!jsonArrayNGO || jsonArrayNGO.length == 0">

                        <td colspan="8" class="text-center">

                            No NGO found

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
